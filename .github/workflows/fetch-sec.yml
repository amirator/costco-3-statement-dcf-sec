name: fetch-sec
# The build machine's network is blocked by SEC, so raw EDGAR JSON is fetched here and downloaded as an artifact.
on: {workflow_dispatch: {}}
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests && python ingest/fetch_sec.py
      - uses: actions/upload-artifact@v4
        with: {name: sec-raw, path: data/raw/}
